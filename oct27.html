<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Namma Space · our capture, 27 October</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
  <script type="module" src="./assets/index-DR5utsI0.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CDYyEeqc.css">
</head>
<body data-room="oct27" data-splat="oct27/scene.ply" data-ready="Click the plan to walk to a point. Walls and furniture stop you. WASD walks. Shift is faster. R resets." data-path-note="It stays on floor the scan measured.">
  <main id="stage"></main>
  <header id="hud">
    <p class="eyebrow">NAMMA SPACE / OUR CAPTURE, 27 OCTOBER</p>
    <h1 id="title">Walk our scan</h1>
    <p id="subtitle">The picture is our own scan: a corridor, then a room. Click the plan and follow the path.</p>
    <form id="find" autocomplete="off">
      <label for="q">SEARCH</label>
      <input id="q" placeholder="corridor, opening, far room">
      <ol id="hits"></ol>
    </form>
    <p id="metrics">Loading…</p>
    <p class="other-room"><a href="index.html">&larr; Back to the MuSHRoom classroom</a></p>
  </header>
  <div id="status-stamp"><span>FROM START</span><b id="distance">0.0 m</b></div>
  <figure id="map-wrap">
    <div class="panel-label">PLAN / FLOOR THE SCAN MEASURED</div>
    <canvas id="plan" width="760" height="230"></canvas>
    <div id="map-legend">
      <span><i class="sw-floor"></i>floor</span>
      <span><i class="sw-furn"></i>not floor</span>
      <span><i class="sw-you"></i>you</span>
      <span><i class="sw-path"></i>path</span>
    </div>
  </figure>
  <p id="help"><b>CLICK</b> the plan <b>WASD</b> move <b>SHIFT</b> faster <b>CLICK</b> look <b>R</b> reset</p>
  <p id="status" role="status">Loading…</p>
  <style>
    body{font-family:'IBM Plex Mono',ui-monospace,monospace;background:#111}
    #hud{left:18px;right:auto;width:min(420px,calc(100vw - 36px));padding:12px 14px 14px;color:#111;background:#f3f0e8;border:3px solid #111;box-shadow:8px 8px 0 #111}
    #hud .eyebrow{font-size:10px;letter-spacing:.12em;font-weight:700;color:#ff4d32;margin:0 0 6px}
    #title{margin:0;font:700 42px/0.9 'Space Grotesk',sans-serif;letter-spacing:-.06em}
    #subtitle{margin:10px 0 0;font-size:12px;line-height:1.4;max-width:36ch}
    #metrics{margin:8px 0 0;font-size:11px}
    .other-room{margin:10px 0 0;font-size:11px;font-weight:700}
    .other-room a{color:#111;background:#d7ff3f;padding:3px 6px;border:2px solid #111;text-decoration:none;display:inline-block}
    .other-room a:hover,.other-room a:focus-visible{background:#111;color:#d7ff3f}
    #find{margin:12px 0 0}
    #find label{display:block;font-size:10px;letter-spacing:.12em;font-weight:700;color:#ff4d32;margin-bottom:4px}
    #q{width:100%;box-sizing:border-box;border:3px solid #111;background:#fff;color:#111;font:600 14px 'IBM Plex Mono',monospace;padding:8px}
    #hits{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
    #hits button{border:2px solid #111;background:#d7ff3f;color:#111;font:600 11px 'IBM Plex Mono',monospace;padding:4px 6px;cursor:pointer}
    #status-stamp{position:fixed;z-index:12;right:18px;top:18px;padding:8px 10px;background:#d7ff3f;color:#111;border:3px solid #111;box-shadow:6px 6px 0 #ff4d32}
    #status-stamp span{display:block;font-size:9px;letter-spacing:.08em;font-weight:700}
    #status-stamp b{font:700 22px/1 'Space Grotesk',sans-serif}
    #map-wrap{position:fixed;z-index:10;right:18px;top:92px;margin:0;width:760px;max-width:calc(100vw - 36px);background:#f3f0e8;border:3px solid #111;box-shadow:8px 8px 0 #111;color:#111}
    .panel-label{font-size:10px;letter-spacing:.12em;font-weight:700;color:#ff4d32;padding:8px 10px;border-bottom:3px solid #111}
    #plan{width:100% !important;height:auto !important;display:block;background:#f3f0e8}
    #map-legend{display:flex;gap:10px;flex-wrap:wrap;padding:8px 10px;font-size:10px;font-weight:600;border-top:3px solid #111}
    #map-legend span{display:inline-flex;align-items:center}
    #map-legend i{width:10px;height:10px;border:1px solid #111;margin-right:4px}
    .sw-floor{background:#c9c8bc}.sw-furn{background:#f3f0e8}.sw-door{background:#d7ff3f}.sw-you{background:#111}.sw-path{background:#d7ff3f}
    #help{position:fixed;z-index:6;margin:0;left:18px;bottom:18px;max-width:none;padding:10px 12px;background:#f3f0e8;color:#111;border:3px solid #111;box-shadow:6px 6px 0 #ff4d32;font-size:12px;font-weight:600}
    #help b{background:#111;color:#d7ff3f;padding:2px 4px;margin-right:4px}
    #status{background:#f3f0e8;color:#111;border:3px solid #111;max-width:640px;bottom:72px}
    aside{display:none}
  #stage canvas{width:100vw !important;height:100vh !important}
  </style>
</body>
</html>
